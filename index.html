<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الموصل → الحضر</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,Tahoma,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:10px;
    right:10px;
    left:10px;
    z-index:10;
    pointer-events:none;
}

.box{
    display:block;
    width:max-content;
    max-width:90%;
    background:rgba(0,0,0,.68);
    color:white;
    padding:9px 13px;
    margin-bottom:6px;
    border-radius:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
}

#title{
    font-size:21px;
    font-weight:bold;
}

#controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:210px;
    height:160px;
    z-index:20;
}

.btn{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    border:2px solid rgba(255,255,255,.65);
    color:white;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
}

#up{top:0;left:75px}
#left{top:70px;left:5px}
#down{top:70px;left:75px}
#right{top:70px;left:145px}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="box" id="title">🇮🇶 الموصل → الحضر</div>
    <div class="box" id="location">🏙️ مدينة الموصل</div>
    <div class="box">🎯 المهمة: الوصول إلى آثار الحضر</div>
    <div class="box" id="speed">🚗 السرعة: 0</div>
</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="down">▼</div>
    <div class="btn" id="right">▶</div>
</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;

    const dpr=Math.min(devicePixelRatio||1,2);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================
   PLAYER
========================= */

const car={
    x:0,
    z:0,
    angle:0,
    speed:0
};


/* =========================
   WORLD
========================= */

const objects=[];

function addBuilding(x,z,w,h,d,color){
    objects.push({
        type:"building",
        x,z,w,h,d,color
    });
}

function addTree(x,z){
    objects.push({
        type:"tree",
        x,z
    });
}

function addRock(x,z,s){
    objects.push({
        type:"rock",
        x,z,s
    });
}


/* =========================
   MOSUL
========================= */

for(let z=-80;z>-420;z-=55){

    addBuilding(-35,z,20,20,20,"#b99b70");
    addBuilding(35,z-20,22,25,22,"#a88962");

    addTree(-65,z);
    addTree(65,z-20);
}


/* =========================
   ROAD BUILDINGS
========================= */

for(let z=-450;z>-900;z-=70){

    addBuilding(-55,z,25,16,25,"#b68c5d");
    addBuilding(55,z-30,25,18,25,"#c29a68");

    addTree(-85,z);
    addTree(85,z-25);
}


/* =========================
   HATRA DISTRICT
========================= */

for(let x=-80;x<=80;x+=40){

    addBuilding(
        x,
        -930,
        25,
        20,
        25,
        "#a97845"
    );
}

for(let x=-70;x<=70;x+=35){

    addTree(x,-1000);
}


/* =========================
   ROCKS
========================= */

for(let i=0;i<50;i++){

    const x=(Math.random()*500)-250;
    const z=-(Math.random()*1500);

    if(Math.abs(x)>25){
        addRock(
            x,
            z,
            3+Math.random()*6
        );
    }
}


/* =========================
   DRAW SKY
========================= */

function drawSky(){

    const gradient=ctx.createLinearGradient(
        0,0,
        0,H
    );

    gradient.addColorStop(0,"#54a9e8");
    gradient.addColorStop(.55,"#9ed8f5");
    gradient.addColorStop(1,"#d9efc4");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    /* الشمس */

    ctx.fillStyle="rgba(255,230,120,.9)";
    ctx.beginPath();
    ctx.arc(
        W-80,
        80,
        35,
        0,
        Math.PI*2
    );
    ctx.fill();
}


/* =========================
   CAMERA
========================= */

function worldToScreen(x,z){

    const dx=x-car.x;
    const dz=z-car.z;

    const sin=Math.sin(car.angle);
    const cos=Math.cos(car.angle);

    const forward=
        -dx*sin+
        -dz*cos;

    const side=
        dx*cos-
        dz*sin;

    const depth=forward+30;

    if(depth<=1){
        return null;
    }

    const scale=
        420/depth;

    return{
        x:W/2+side*scale,
        y:H*.48-forward*scale*.72,
        scale
    };
}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle="#9c783f";
    ctx.fillRect(
        0,
        H*.48,
        W,
        H*.52
    );
}


/* =========================
   ROAD
========================= */

function drawRoad(){

    const horizon=H*.48;

    ctx.fillStyle="#303030";

    ctx.beginPath();

    ctx.moveTo(W*.48,horizon);
    ctx.lineTo(W*.52,horizon);

    ctx.lineTo(W*.96,H);
    ctx.lineTo(W*.04,H);

    ctx.closePath();

    ctx.fill();


    /* جوانب الطريق */

    ctx.strokeStyle="#e6d29a";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(W*.48,horizon);
    ctx.lineTo(W*.04,H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W*.52,horizon);
    ctx.lineTo(W*.96,H);
    ctx.stroke();


    /* خط الوسط */

    ctx.strokeStyle="#f4e8a0";
    ctx.lineWidth=4;
    ctx.setLineDash([25,25]);

    ctx.beginPath();

    ctx.moveTo(W/2,horizon);
    ctx.lineTo(W/2,H);

    ctx.stroke();

    ctx.setLineDash([]);
}


/* =========================
   RIVER
========================= */

function drawRiver(){

    const horizon=H*.48;

    ctx.fillStyle="#267eb0";

    ctx.beginPath();

    ctx.moveTo(
        W*.60,
        horizon
    );

    ctx.lineTo(
        W*.76,
        horizon
    );

    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        W*.58,
        H
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle="rgba(255,255,255,.35)";
    ctx.lineWidth=2;

    for(let y=horizon+20;y<H;y+=35){

        ctx.beginPath();
        ctx.moveTo(W*.63,y);
        ctx.lineTo(W*.92,y);
        ctx.stroke();
    }
}


/* =========================
   BUILDINGS
========================= */

function drawBuilding(o,p){

    const s=p.scale;

    const width=o.w*s;
    const height=o.h*s;

    if(width<2) return;

    /* ظل */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
        p.x-width*.5+5,
        p.y-height+8,
        width,
        height
    );

    /* جسم */

    ctx.fillStyle=o.color;

    ctx.fillRect(
        p.x-width*.5,
        p.y-height,
        width,
        height
    );

    /* السطح */

    ctx.fillStyle="#765335";

    ctx.fillRect(
        p.x-width*.55,
        p.y-height-5*s,
        width*1.1,
        6*s
    );

    /* شبابيك */

    const rows=2;
    const cols=3;

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            const wx=
                p.x-width*.35+
                c*width*.35;

            const wy=
                p.y-height*.75+
                r*height*.32;

            ctx.fillStyle="#304c59";

            ctx.fillRect(
                wx,
                wy,
                Math.max(2,width*.10),
                Math.max(2,height*.12)
            );
        }
    }
}


/* =========================
   TREES
========================= */

function drawTree(o,p){

    const s=p.scale;

    if(s<.015) return;

    /* جذع */

    ctx.fillStyle="#70472a";

    ctx.fillRect(
        p.x-5*s,
        p.y-35*s,
        10*s,
        35*s
    );

    /* تاج */

    ctx.fillStyle="#26723a";

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y-48*s,
        25*s,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#35884a";

    ctx.beginPath();
    ctx.arc(
        p.x-12*s,
        p.y-58*s,
        18*s,
        0,
        Math.PI*2
    );
    ctx.fill();
}


/* =========================
   ROCK
========================= */

function drawRock(o,p){

    const s=p.scale*o.s;

    if(s<1) return;

    ctx.fillStyle="#78664c";

    ctx.beginPath();

    ctx.moveTo(p.x-s,p.y);
    ctx.lineTo(p.x-s*.5,p.y-s);
    ctx.lineTo(p.x+s*.4,p.y-s*.8);
    ctx.lineTo(p.x+s,p.y);
    ctx.closePath();

    ctx.fill();
}


/* =========================
   HATRA RUINS
========================= */

function drawHatra(){

    const p=worldToScreen(0,-1150);

    if(!p) return;

    const s=p.scale;

    /* البوابة */

    const w=150*s;
    const h=130*s;

    ctx.fillStyle="#b3834c";

    ctx.fillRect(
        p.x-w*.5,
        p.y-h,
        w,
        h
    );

    /* القوس */

    ctx.fillStyle="#27201a";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-h*.55,
        w*.27,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.fillRect(
        p.x-w*.27,
        p.y-h*.55,
        w*.54,
        h*.55
    );

    /* الأعمدة */

    for(let i=-3;i<=3;i++){

        const x=p.x+i*35*s;

        ctx.fillStyle="#d09b58";

        ctx.fillRect(
            x-7*s,
            p.y-h*.85,
            14*s,
            h*.8
        );
    }

    /* اسم المكان */

    if(s>.05){

        ctx.fillStyle="white";
        ctx.font=Math.max(14,30*s)+"px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "🏛️ آثار الحضر",
            p.x,
            p.y-h-15*s
        );
    }
}


/* =========================
   CAR
========================= */

function drawCar(){

    const x=W/2;
    const y=H*.72;

    /* ظل */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+28,
        42,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* جسم السيارة */

    ctx.fillStyle="#c71919";

    ctx.beginPath();

    ctx.roundRect(
        x-35,
        y-40,
        70,
        80,
        12
    );

    ctx.fill();


    /* الزجاج */

    ctx.fillStyle="#172c3a";

    ctx.beginPath();

    ctx.roundRect(
        x-25,
        y-25,
        50,
        28,
        7
    );

    ctx.fill();


    /* الصدام */

    ctx.fillStyle="#222";

    ctx.fillRect(
        x-30,
        y+30,
        60,
        8
    );


    /* الأضواء */

    ctx.fillStyle="#fff3a0";

    ctx.fillRect(
        x-25,
        y+25,
        10,
        7
    );

    ctx.fillRect(
        x+15,
        y+25,
        10,
        7
    );
}


/* =========================
   WORLD RENDER
========================= */

function renderWorld(){

    drawSky();

    drawGround();

    drawRiver();

    drawRoad();


    /* العناصر حسب العمق */

    const visible=[];

    for(const o of objects){

        const p=worldToScreen(
            o.x,
            o.z
        );

        if(!p) continue;

        if(
            p.x<-200 ||
            p.x>W+200 ||
            p.y<-200 ||
            p.y>H+200
        ) continue;

        visible.push({
            o,
            p
        });
    }


    visible.sort(
        (a,b)=>b.p.scale-a.p.scale
    );


    for(const item of visible){

        if(item.o.type==="building")
            drawBuilding(
                item.o,
                item.p
            );

        else if(item.o.type==="tree")
            drawTree(
                item.o,
                item.p
            );

        else if(item.o.type==="rock")
            drawRock(
                item.o,
                item.p
            );
    }


    drawHatra();

    drawCar();
}


/* =========================
   CONTROLS
========================= */

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


function button(id,key){

    const el=
        document.getElementById(id);

    function down(e){
        e.preventDefault();
        keys[key]=true;
    }

    function up(e){
        e.preventDefault();
        keys[key]=false;
    }

    el.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    el.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    el.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

    el.addEventListener(
        "mousedown",
        down
    );

    el.addEventListener(
        "mouseup",
        up
    );

    el.addEventListener(
        "mouseleave",
        up
    );
}

button("up","arrowup");
button("down","arrowdown");
button("left","arrowleft");
button("right","arrowright");


/* =========================
   CAR PHYSICS
========================= */

function update(){

    const accelerating=
        keys["arrowup"] ||
        keys["w"];

    const braking=
        keys["arrowdown"] ||
        keys["s"];

    const left=
        keys["arrowleft"] ||
        keys["a"];

    const right=
        keys["arrowright"] ||
        keys["d"];


    if(accelerating)
        car.speed+=.012;

    if(braking)
        car.speed-=.018;


    if(
        !accelerating &&
        !braking
    ){
        car.speed*=.96;
    }


    car.speed=
        Math.max(
            -.7,
            Math.min(
                2.2,
                car.speed
            )
        );


    if(left){

        car.angle+=
            .025*
            Math.max(
                Math.abs(car.speed),
                .25
            );
    }


    if(right){

        car.angle-=
            .025*
            Math.max(
                Math.abs(car.speed),
                .25
            );
    }


    car.x+=
        Math.sin(car.angle)*
        car.speed;

    car.z-=
        Math.cos(car.angle)*
        car.speed;


    /* حدود العالم */

    if(car.x>180)
        car.x=180;

    if(car.x<-180)
        car.x=-180;

    if(car.z>50)
        car.z=50;

    if(car.z<-1300)
        car.z=-1300;


    const speed=
        Math.round(
            Math.abs(car.speed)*60
        );

    document.getElementById(
        "speed"
    ).innerText=
        "🚗 السرعة: "+speed;


    let location="🏙️ مدينة الموصل";

    if(car.z>-400)
        location="🏙️ مدينة الموصل";

    else if(car.z>-850)
        location="🛣️ طريق الموصل → الحضر";

    else if(car.z>-1050)
        location="🏘️ قضاء الحضر";

    else
        location="🏛️ آثار الحضر";


    document.getElementById(
        "location"
    ).innerText=location;
}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();

    renderWorld();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
