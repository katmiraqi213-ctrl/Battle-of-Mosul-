<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الموصل - الحضر | Open World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.55);
    padding:12px 16px;
    border-radius:14px;
}

#title{
    font-size:20px;
    font-weight:bold;
}

#location{
    margin-top:6px;
    font-size:14px;
}

#controls{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:20;
    display:flex;
    gap:8px;
}

button{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:22px;
}

#info{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.5);
    padding:10px 14px;
    border-radius:12px;
}
</style>
</head>

<body>

<div id="hud">
    <div id="title">🇮🇶 الموصل - الحضر</div>
    <div id="location">العالم المفتوح • المرحلة التجريبية</div>
</div>

<div id="info">
    تحرك بالأسهم أو الأزرار
</div>

<div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
</div>

<canvas id="game"></canvas>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9df);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,8,14);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

/* الإضاءة */

const sunlight = new THREE.DirectionalLight(0xffffff,2);
sunlight.position.set(100,200,100);
scene.add(sunlight);

const ambient = new THREE.AmbientLight(0xffffff,.7);
scene.add(ambient);

/* الأرض */

const groundGeometry = new THREE.PlaneGeometry(1000,1000);

const groundMaterial = new THREE.MeshStandardMaterial({
    color:0xb79b62
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* الطريق */

const roadGeometry = new THREE.PlaneGeometry(35,1000);

const roadMaterial = new THREE.MeshStandardMaterial({
    color:0x303030
});

const road = new THREE.Mesh(
    roadGeometry,
    roadMaterial
);

road.rotation.x=-Math.PI/2;
road.position.y=.02;

scene.add(road);

/* خط الطريق */

for(let z=-480;z<500;z+=25){

    const lineGeometry = new THREE.BoxGeometry(1,.05,12);

    const lineMaterial = new THREE.MeshStandardMaterial({
        color:0xffd84d
    });

    const line = new THREE.Mesh(
        lineGeometry,
        lineMaterial
    );

    line.position.set(0,.08,z);

    scene.add(line);
}

/* مباني */

function createBuilding(x,z,w,h,d){

    const geometry = new THREE.BoxGeometry(w,h,d);

    const material = new THREE.MeshStandardMaterial({
        color:0xc29b68
    });

    const building = new THREE.Mesh(
        geometry,
        material
    );

    building.position.set(x,h/2,z);

    scene.add(building);

    /* سطح */

    const roofGeometry =
        new THREE.BoxGeometry(w+.3,.25,d+.3);

    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color:0x8d6c48
        });

    const roof = new THREE.Mesh(
        roofGeometry,
        roofMaterial
    );

    roof.position.set(x,h+.1,z);

    scene.add(roof);
}

/* مدينة تجريبية */

for(let x=-120;x<=120;x+=35){

    for(let z=-180;z<80;z+=40){

        if(Math.abs(x)<30) continue;

        const height=8+Math.random()*15;

        createBuilding(
            x,
            z,
            22,
            height,
            25
        );
    }
}

/* أشجار */

function createTree(x,z){

    const trunkGeometry =
        new THREE.CylinderGeometry(.6,.8,5);

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color:0x654321
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.set(x,2.5,z);
    scene.add(trunk);

    const leavesGeometry =
        new THREE.SphereGeometry(3.5,10,10);

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color:0x3f6f32
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.set(x,7,z);
    scene.add(leaves);
}

for(let i=0;i<80;i++){

    const side =
        Math.random()<.5 ? -1 : 1;

    const x =
        side*(35+Math.random()*150);

    const z =
        -450+Math.random()*700;

    createTree(x,z);
}

/* سيارة اللاعب */

const car = new THREE.Group();

/* جسم السيارة */

const carBodyGeometry =
    new THREE.BoxGeometry(4,1.3,7);

const carBodyMaterial =
    new THREE.MeshStandardMaterial({
        color:0x9b1c1c
    });

const body =
    new THREE.Mesh(
        carBodyGeometry,
        carBodyMaterial
    );

body.position.y=1.3;
car.add(body);

/* سقف السيارة */

const roofGeometry =
    new THREE.BoxGeometry(3.2,1.1,3.5);

const roofMaterial =
    new THREE.MeshStandardMaterial({
        color:0x222222
    });

const roof =
    new THREE.Mesh(
        roofGeometry,
        roofMaterial
    );

roof.position.set(0,2.2,.2);

car.add(roof);

/* العجلات */

function wheel(x,z){

    const geometry =
        new THREE.CylinderGeometry(
            .75,.75,.5,20
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x111111
        });

    const w =
        new THREE.Mesh(
            geometry,
            material
        );

    w.rotation.z=Math.PI/2;
    w.position.set(x,.8,z);

    car.add(w);
}

wheel(-2,-2.3);
wheel(2,-2.3);
wheel(-2,2.3);
wheel(2,2.3);

car.position.set(0,0,100);

scene.add(car);

/* التحكم */

const keys={};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function button(id,key){

    const b=document.getElementById(id);

    b.addEventListener("pointerdown",()=>{
        keys[key]=true;
    });

    b.addEventListener("pointerup",()=>{
        keys[key]=false;
    });

    b.addEventListener("pointerleave",()=>{
        keys[key]=false;
    });
}

button("up","w");
button("down","s");
button("left","a");
button("right","d");

/* حركة السيارة */

function update(){

    const speed=.7;

    if(keys["w"] || keys["arrowup"])
        car.position.z-=speed;

    if(keys["s"] || keys["arrowdown"])
        car.position.z+=speed;

    if(keys["a"] || keys["arrowleft"])
        car.position.x-=speed;

    if(keys["d"] || keys["arrowright"])
        car.position.x+=speed;

    /* الكاميرا تتبع السيارة */

    camera.position.x +=
        (car.position.x-camera.position.x)*.08;

    camera.position.z +=
        (car.position.z+14-camera.position.z)*.08;

    camera.lookAt(
        car.position.x,
        1,
        car.position.z
    );

    document.getElementById("location").textContent =
        "العالم المفتوح • X: "+
        Math.round(car.position.x)+
        " • Z: "+
        Math.round(car.position.z);
}

/* التشغيل */

function animate(){

    requestAnimationFrame(animate);

    update();

    renderer.render(scene,camera);
}

animate();

/* تغيير حجم الشاشة */

window.addEventListener("resize",()=>{

    camera.aspect =
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
