<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>الموصل - الحضر | Open World</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #76b9e8;
    font-family: Arial, Tahoma, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    min-width: 190px;
    color: white;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 15px;
    padding: 12px 15px;
    backdrop-filter: blur(6px);
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

#hud .title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

#location {
    font-size: 14px;
    margin-bottom: 5px;
}

#mission {
    font-size: 13px;
    color: #ffe082;
    margin-bottom: 5px;
}

#speed {
    font-size: 13px;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #76b9e8;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

#error {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.92);
    color: white;
    padding: 30px 20px;
    text-align: center;
}

#error h2 {
    color: #ff5252;
    margin-top: 30px;
}

#errorText {
    direction: ltr;
    text-align: left;
    background: #111;
    border-radius: 10px;
    padding: 15px;
    margin-top: 20px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
}

#controls {
    position: fixed;
    left: 18px;
    bottom: 20px;
    z-index: 30;
    width: 155px;
    height: 155px;
}

.btn {
    position: absolute;
    width: 58px;
    height: 58px;
    border: 0;
    border-radius: 18px;
    background: rgba(0,0,0,.58);
    color: white;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
    user-select: none;
    touch-action: none;
}

.btn:active {
    background: rgba(255,255,255,.35);
    transform: scale(.94);
}

#up {
    left: 49px;
    top: 0;
}

#down {
    left: 49px;
    bottom: 0;
}

#left {
    left: 0;
    top: 49px;
}

#right {
    right: 0;
    top: 49px;
}

#hint {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 15;
    color: white;
    background: rgba(0,0,0,.45);
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 12px;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    🇮🇶 جاري تحميل عالم الموصل...
</div>

<div id="hud">
    <div class="title">🇮🇶 الموصل - الحضر</div>
    <div id="location">🏙️ مدينة الموصل</div>
    <div id="mission">المهمة: اتجه جنوباً نحو الحضر</div>
    <div id="speed">السرعة: 0</div>
</div>

<div id="controls">
    <button class="btn" id="up">▲</button>
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
    <button class="btn" id="down">▼</button>
</div>

<div id="hint">
    الأسهم أو WASD للتحكم بالسيارة
</div>

<div id="error">
    <h2>حدث خطأ في تشغيل اللعبة</h2>
    <div id="errorText"></div>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.180.0/build/three.min.js"></script>

<script>
(function () {

"use strict";

try {

    /* =========================
       التأكد من تحميل Three.js
       ========================= */

    if (typeof THREE === "undefined") {
        throw new Error(
            "لم يتم تحميل Three.js. تأكد من اتصال الإنترنت ثم أعد فتح اللعبة."
        );
    }

    /* =========================
       المشهد
       ========================= */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x78b9e8);

    scene.fog = new THREE.Fog(
        0x78b9e8,
        250,
        1300
    );

    /* =========================
       الكاميرا
       ========================= */

    const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
    );

    /* =========================
       Renderer
       ========================= */

    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById("game").appendChild(renderer.domElement);

    /* =========================
       الإضاءة
       ========================= */

    const ambient = new THREE.HemisphereLight(
        0xbfe8ff,
        0x665544,
        2.2
    );

    scene.add(ambient);

    const sun = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    sun.position.set(
        -250,
        350,
        150
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;

    sun.shadow.camera.left = -500;
    sun.shadow.camera.right = 500;
    sun.shadow.camera.top = 500;
    sun.shadow.camera.bottom = -500;

    scene.add(sun);

    /* =========================
       مواد
       ========================= */

    const materials = {

        grass: new THREE.MeshLambertMaterial({
            color: 0x8b9a58
        }),

        desert: new THREE.MeshLambertMaterial({
            color: 0xc9ad70
        }),

        road: new THREE.MeshLambertMaterial({
            color: 0x353535
        }),

        roadLine: new THREE.MeshBasicMaterial({
            color: 0xf2df83
        }),

        sidewalk: new THREE.MeshLambertMaterial({
            color: 0xaaa99e
        }),

        building1: new THREE.MeshLambertMaterial({
            color: 0xb9a078
        }),

        building2: new THREE.MeshLambertMaterial({
            color: 0x9b8060
        }),

        building3: new THREE.MeshLambertMaterial({
            color: 0xc8b38d
        }),

        river: new THREE.MeshLambertMaterial({
            color: 0x238bc0,
            transparent: true,
            opacity: .88
        }),

        tree: new THREE.MeshLambertMaterial({
            color: 0x386b31
        }),

        trunk: new THREE.MeshLambertMaterial({
            color: 0x63462c
        }),

        stone: new THREE.MeshLambertMaterial({
            color: 0xb58c55
        }),

        car: new THREE.MeshLambertMaterial({
            color: 0xc62828
        }),

        black: new THREE.MeshLambertMaterial({
            color: 0x111111
        }),

        glass: new THREE.MeshLambertMaterial({
            color: 0x75a9c4
        })

    };

    /* =========================
       دوال مساعدة
       ========================= */

    function box(
        w,
        h,
        d,
        material,
        x,
        y,
        z
    ) {

        const geometry =
            new THREE.BoxGeometry(w, h, d);

        const mesh =
            new THREE.Mesh(geometry, material);

        mesh.position.set(x, y, z);

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);

        return mesh;
    }

    function cylinder(
        radiusTop,
        radiusBottom,
        height,
        material,
        x,
        y,
        z
    ) {

        const geometry =
            new THREE.CylinderGeometry(
                radiusTop,
                radiusBottom,
                height,
                16
            );

        const mesh =
            new THREE.Mesh(geometry, material);

        mesh.position.set(x, y, z);

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);

        return mesh;
    }

    /* =========================
       الأرض
       ========================= */

    box(
        1500,
        1,
        1600,
        materials.grass,
        0,
        -0.5,
        -350
    );

    /* =========================
       الصحراء حول الحضر
       ========================= */

    box(
        900,
        .5,
        700,
        materials.desert,
        0,
        0,
        -780
    );

    /* =========================
       الطريق الرئيسي
       ========================= */

    box(
        42,
        .3,
        1150,
        materials.road,
        0,
        0.12,
        -300
    );

    /* =========================
       خطوط الطريق
       ========================= */

    for (
        let z = 250;
        z > -870;
        z -= 24
    ) {

        box(
            1.2,
            .08,
            12,
            materials.roadLine,
            0,
            .3,
            z
        );

    }

    /* =========================
       طرق جانبية
       ========================= */

    function sideRoad(x, z, length, rotation) {

        const r = box(
            12,
            .25,
            length,
            materials.road,
            x,
            .13,
            z
        );

        r.rotation.y = rotation;

    }

    sideRoad(
        -110,
        155,
        180,
        Math.PI / 2
    );

    sideRoad(
        120,
        40,
        230,
        Math.PI / 2
    );

    sideRoad(
        -130,
        -300,
        200,
        Math.PI / 2
    );

    sideRoad(
        125,
        -510,
        210,
        Math.PI / 2
    );

    /* =========================
       نهر دجلة
       ========================= */

    box(
        260,
        .25,
        115,
        materials.river,
        0,
        .18,
        105
    );

    /* =========================
       الجسر
       ========================= */

    box(
        270,
        1,
        22,
        materials.road,
        0,
        2,
        105
    );

    box(
        270,
        .6,
        3,
        materials.sidewalk,
        0,
        2.8,
        91
    );

    box(
        270,
        .6,
        3,
        materials.sidewalk,
        0,
        2.8,
        119
    );

    for (
        let x = -120;
        x <= 120;
        x += 40
    ) {

        box(
            3,
            28,
            4,
            materials.stone,
            x,
            -12,
            105
        );

    }

    /* =========================
       بنايات الموصل
       ========================= */

    function createBuilding(
        x,
        z,
        w,
        h,
        d,
        material
    ) {

        box(
            w,
            h,
            d,
            material,
            x,
            h / 2,
            z
        );

        /* سطح */

        box(
            w * .9,
            .6,
            d * .9,
            materials.building2,
            x,
            h + .3,
            z
        );

    }

    for (
        let x = -130;
        x <= 130;
        x += 42
    ) {

        if (Math.abs(x) > 30) {

            createBuilding(
                x,
                220,
                28,
                18 + Math.random() * 18,
                32,
                materials.building1
            );

            createBuilding(
                x,
                275,
                30,
                15 + Math.random() * 20,
                35,
                materials.building3
            );

        }

    }

    for (
        let x = -130;
        x <= 130;
        x += 45
    ) {

        if (Math.abs(x) > 30) {

            createBuilding(
                x,
                40,
                28,
                15 + Math.random() * 20,
                32,
                materials.building2
            );

        }

    }

    /* =========================
       بنايات قضاء الحضر
       ========================= */

    for (
        let x = -120;
        x <= 120;
        x += 45
    ) {

        if (Math.abs(x) > 35) {

            createBuilding(
                x,
                -530,
                30,
                10 + Math.random() * 12,
                30,
                materials.building3
            );

            createBuilding(
                x,
                -585,
                32,
                9 + Math.random() * 10,
                32,
                materials.building1
            );

        }

    }

    /* =========================
       أشجار
       ========================= */

    function createTree(x, z) {

        cylinder(
            1.2,
            1.5,
            7,
            materials.trunk,
            x,
            3.5,
            z
        );

        const crown =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    5,
                    12,
                    10
                ),
                materials.tree
            );

        crown.position.set(
            x,
            9,
            z
        );

        crown.castShadow = true;

        scene.add(crown);

    }

    for (
        let z = 260;
        z > -650;
        z -= 38
    ) {

        createTree(
            -65,
            z
        );

        createTree(
            65,
            z
        );

    }

    /* =========================
       بوابة قضاء الحضر
       ========================= */

    function createGate() {

        const z = -455;

        box(
            12,
            24,
            8,
            materials.stone,
            -28,
            12,
            z
        );

        box(
            12,
            24,
            8,
            materials.stone,
            28,
            12,
            z
        );

        box(
            68,
            9,
            8,
            materials.stone,
            0,
            25,
            z
        );

        box(
            18,
            15,
            9,
            materials.stone,
            0,
            12,
            z
        );

        /* فتحة البوابة */

        box(
            18,
            15,
            10,
            materials.desert,
            0,
            10,
            z - .2
        );

    }

    createGate();

    /* =========================
       آثار الحضر
       ========================= */

    function createHatraTemple(
        x,
        z,
        scale
    ) {

        box(
            30 * scale,
            35 * scale,
            12 * scale,
            materials.stone,
            x,
            17.5 * scale,
            z
        );

        box(
            38 * scale,
            6 * scale,
            18 * scale,
            materials.stone,
            x,
            36 * scale,
            z
        );

        box(
            8 * scale,
            26 * scale,
            8 * scale,
            materials.stone,
            x - 18 * scale,
            13 * scale,
            z
        );

        box(
            8 * scale,
            26 * scale,
            8 * scale,
            materials.stone,
            x + 18 * scale,
            13 * scale,
            z
        );

    }

    createHatraTemple(
        0,
        -790,
        1.2
    );

    createHatraTemple(
        -65,
        -850,
        .8
    );

    createHatraTemple(
        75,
        -850,
        .8
    );

    /* =========================
       أعمدة آثار الحضر
       ========================= */

    for (
        let x = -130;
        x <= 130;
        x += 26
    ) {

        cylinder(
            2.2,
            2.7,
            20,
            materials.stone,
            x,
            10,
            -730
        );

    }

    /* =========================
       السيارة
       ========================= */

    const car =
        new THREE.Group();

    /* الجسم */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5.5,
                1.8,
                9
            ),
            materials.car
        );

    body.position.y = 2.1;
    body.castShadow = true;

    car.add(body);

    /* الجزء العلوي */

    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.4,
                1.7,
                4.5
            ),
            materials.car
        );

    cabin.position.y = 3.65;
    cabin.position.z = .4;
    cabin.castShadow = true;

    car.add(cabin);

    /* الزجاج الأمامي */

    const windshield =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.0,
                1.1,
                .25
            ),
            materials.glass
        );

    windshield.position.set(
        0,
        3.7,
        -1.85
    );

    car.add(windshield);

    /* الزجاج الخلفي */

    const rearGlass =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.0,
                1.1,
                .25
            ),
            materials.glass
        );

    rearGlass.position.set(
        0,
        3.7,
        2.65
    );

    car.add(rearGlass);

    /* العجلات */

    function wheel(x, z) {

        const w =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    1.25,
                    1.25,
                    1,
                    16
                ),
                materials.black
            );

        w.rotation.z =
            Math.PI / 2;

        w.position.set(
            x,
            1.25,
            z
        );

        w.castShadow = true;

        car.add(w);

    }

    wheel(-3, -2.8);
    wheel(3, -2.8);
    wheel(-3, 2.8);
    wheel(3, 2.8);

    car.position.set(
        0,
        0,
        330
    );

    car.rotation.y = Math.PI;

    scene.add(car);

    /* =========================
       التحكم
       ========================= */

    const keys = {
        up: false,
        down: false,
        left: false,
        right: false
    };

    function setKey(
        key,
        value
    ) {
        keys[key] = value;
    }

    window.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "ArrowUp" ||
                e.key.toLowerCase() === "w"
            ) {
                setKey("up", true);
            }

            if (
                e.key === "ArrowDown" ||
                e.key.toLowerCase() === "s"
            ) {
                setKey("down", true);
            }

            if (
                e.key === "ArrowLeft" ||
                e.key.toLowerCase() === "a"
            ) {
                setKey("left", true);
            }

            if (
                e.key === "ArrowRight" ||
                e.key.toLowerCase() === "d"
            ) {
                setKey("right", true);
            }

        }
    );

    window.addEventListener(
        "keyup",
        function(e) {

            if (
                e.key === "ArrowUp" ||
                e.key.toLowerCase() === "w"
            ) {
                setKey("up", false);
            }

            if (
                e.key === "ArrowDown" ||
                e.key.toLowerCase() === "s"
            ) {
                setKey("down", false);
            }

            if (
                e.key === "ArrowLeft" ||
                e.key.toLowerCase() === "a"
            ) {
                setKey("left", false);
            }

            if (
                e.key === "ArrowRight" ||
                e.key.toLowerCase() === "d"
            ) {
                setKey("right", false);
            }

        }
    );

    /* =========================
       أزرار الهاتف
       ========================= */

    function mobileButton(
        id,
        key
    ) {

        const element =
            document.getElementById(id);

        element.addEventListener(
            "pointerdown",
            function(e) {
                e.preventDefault();
                setKey(key, true);
            }
        );

        element.addEventListener(
            "pointerup",
            function(e) {
                e.preventDefault();
                setKey(key, false);
            }
        );

        element.addEventListener(
            "pointercancel",
            function() {
                setKey(key, false);
            }
        );

        element.addEventListener(
            "pointerleave",
            function() {
                setKey(key, false);
            }
        );

    }

    mobileButton("up", "up");
    mobileButton("down", "down");
    mobileButton("left", "left");
    mobileButton("right", "right");

    /* =========================
       حركة السيارة
       ========================= */

    let speed = 0;

    const maxSpeed = 1.5;
    const reverseSpeed = .8;
    const acceleration = .045;
    const friction = .025;
    const steering = .045;

    function updateCar() {

        if (keys.up) {

            speed += acceleration;

        } else if (keys.down) {

            speed -= acceleration;

        } else {

            if (speed > 0) {
                speed -= friction;
            }

            if (speed < 0) {
                speed += friction;
            }

            if (Math.abs(speed) < .02) {
                speed = 0;
            }

        }

        speed =
            Math.max(
                -reverseSpeed,
                Math.min(
                    maxSpeed,
                    speed
                )
            );

        if (Math.abs(speed) > .05) {

            if (keys.left) {

                car.rotation.y +=
                    steering *
                    (speed > 0 ? 1 : -1);

            }

            if (keys.right) {

                car.rotation.y -=
                    steering *
                    (speed > 0 ? 1 : -1);

            }

        }

        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            car.quaternion
        );

        car.position.addScaledVector(
            direction,
            speed
        );

        /* حدود العالم */

        car.position.x =
            Math.max(
                -430,
                Math.min(
                    430,
                    car.position.x
                )
            );

        car.position.z =
            Math.max(
                -900,
                Math.min(
                    380,
                    car.position.z
                )
            );

        document.getElementById(
            "speed"
        ).textContent =
            "السرعة: " +
            Math.round(
                Math.abs(speed) * 60
            );

    }

    /* =========================
       تحديد الموقع
       ========================= */

    function updateLocation() {

        const z =
            car.position.z;

        let text;
        let mission;

        if (z > 145) {

            text =
                "🏙️ مدينة الموصل";

            mission =
                "المهمة: اخرج من الموصل واتجه جنوباً";

        } else if (z > 20) {

            text =
                "🌊 نهر دجلة - جسر الموصل";

            mission =
                "المهمة: اعبر جسر الموصل";

        } else if (z > -430) {

            text =
                "🛣️ الطريق باتجاه الحضر";

            mission =
                "المهمة: تابع الطريق نحو قضاء الحضر";

        } else if (z > -610) {

            text =
                "🏘️ مركز قضاء الحضر";

            mission =
                "المهمة: اعبر مركز القضاء";

        } else if (z > -700) {

            text =
                "🏜️ الطريق إلى آثار الحضر";

            mission =
                "المهمة: توجه إلى الآثار";

        } else {

            text =
                "🏛️ آثار الحضر";

            mission =
                "🎉 وصلت إلى آثار الحضر!";

        }

        document.getElementById(
            "location"
        ).textContent = text;

        document.getElementById(
            "mission"
        ).textContent = mission;

    }

    /* =========================
       الكاميرا
       ========================= */

    const cameraOffset =
        new THREE.Vector3(
            0,
            18,
            28
        );

    function updateCamera() {

        const desired =
            cameraOffset.clone();

        desired.applyQuaternion(
            car.quaternion
        );

        desired.add(
            car.position
        );

        camera.position.lerp(
            desired,
            .08
        );

        const target =
            car.position.clone();

        target.y += 2;

        camera.lookAt(target);

    }

    /* =========================
       Resize
       ========================= */

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

    /* =========================
       بدء اللعبة
       ========================= */

    document.getElementById(
        "loading"
    ).style.display = "none";

    updateCamera();

    /* =========================
       الحلقة الرئيسية
       ========================= */

    function animate() {

        requestAnimationFrame(
            animate
        );

        updateCar();
        updateLocation();
        updateCamera();

        renderer.render(
            scene,
            camera
        );

    }

    animate();

}
catch (error) {

    console.error(error);

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "error"
    ).style.display = "block";

    document.getElementById(
        "errorText"
    ).textContent =
        error.name +
        ": " +
        error.message +
        "\n\n" +
        (error.stack || "");

}

})();
</script>

</body>
</html>
