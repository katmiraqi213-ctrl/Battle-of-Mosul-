<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموصل - الحضر</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b9df;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    background:rgba(0,0,0,.65);
    color:white;
    padding:14px 18px;
    border-radius:15px;
    text-align:right;
    font-size:16px;
}

#title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

#controls{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:grid;
    grid-template-columns:70px 70px 70px;
    grid-template-rows:70px 70px;
    gap:8px;
}

button{
    border:0;
    border-radius:18px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:30px;
    font-weight:bold;
}

.up{
    grid-column:2;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">🇮🇶 الموصل - الحضر</div>
    <div id="location">🏙️ مدينة الموصل</div>
    <div id="mission">المهمة: توجه جنوباً نحو الحضر</div>
    <div id="speed">السرعة: 0</div>
</div>

<div id="controls">
    <button class="up" data-key="w">▲</button>
    <button class="left" data-key="a">◀</button>
    <button class="down" data-key="s">▼</button>
    <button class="right" data-key="d">▶</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize",resize);

let carX = canvas.width / 2;
let carY = canvas.height / 2;

let keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

document.querySelectorAll("button").forEach(btn=>{

    const key = btn.dataset.key;

    btn.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key] = true;
    });

    btn.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key] = false;
    });

    btn.addEventListener("mousedown",()=>{
        keys[key] = true;
    });

    btn.addEventListener("mouseup",()=>{
        keys[key] = false;
    });

});

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // السماء
    ctx.fillStyle="#87b9df";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // الأرض
    ctx.fillStyle="#c8a96b";
    ctx.fillRect(0,canvas.height*0.45,canvas.width,canvas.height);

    // الطريق الرئيسي
    ctx.fillStyle="#3d3d3d";
    ctx.fillRect(
        canvas.width*0.30,
        0,
        canvas.width*0.40,
        canvas.height
    );

    // خطوط الطريق
    ctx.strokeStyle="#f5d547";
    ctx.lineWidth=6;
    ctx.setLineDash([30,25]);

    ctx.beginPath();

    ctx.moveTo(canvas.width/2,0);
    ctx.lineTo(canvas.width/2,canvas.height);

    ctx.stroke();

    ctx.setLineDash([]);

    // مباني يسار
    for(let i=0;i<8;i++){

        ctx.fillStyle=i%2===0 ? "#b98f65" : "#9d7957";

        ctx.fillRect(
            30,
            80+i*75,
            180,
            55
        );
    }

    // مباني يمين
    for(let i=0;i<8;i++){

        ctx.fillStyle=i%2===0 ? "#b98f65" : "#9d7957";

        ctx.fillRect(
            canvas.width-210,
            80+i*75,
            180,
            55
        );
    }

    // الأشجار
    for(let i=0;i<15;i++){

        let x=30+(i*97)%canvas.width;
        let y=canvas.height*0.55+(i*83)%(canvas.height*0.4);

        ctx.fillStyle="#65452d";
        ctx.fillRect(x-4,y,8,25);

        ctx.fillStyle="#2f7137";
        ctx.beginPath();
        ctx.arc(x,y,22,0,Math.PI*2);
        ctx.fill();
    }

    // الجسر / نهر دجلة
    ctx.fillStyle="#287bb5";
    ctx.fillRect(
        0,
        canvas.height*0.28,
        canvas.width,
        70
    );

    ctx.fillStyle="#555";

    ctx.fillRect(
        canvas.width*0.30,
        canvas.height*0.25,
        canvas.width*0.40,
        130
    );

    // جسر
    ctx.strokeStyle="#ddd";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(canvas.width*0.30,canvas.height*0.30);
    ctx.lineTo(canvas.width*0.70,canvas.height*0.30);

    ctx.moveTo(canvas.width*0.30,canvas.height*0.58);
    ctx.lineTo(canvas.width*0.70,canvas.height*0.58);

    ctx.stroke();

    // السيارة
    if(keys["w"] || keys["arrowup"]) carY -= 4;
    if(keys["s"] || keys["arrowdown"]) carY += 4;
    if(keys["a"] || keys["arrowleft"]) carX -= 4;
    if(keys["d"] || keys["arrowright"]) carX += 4;

    carX=Math.max(30,Math.min(canvas.width-30,carX));
    carY=Math.max(30,Math.min(canvas.height-30,carY));

    // ظل السيارة
    ctx.fillStyle="rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.ellipse(carX,carY+20,28,10,0,0,Math.PI*2);
    ctx.fill();

    // جسم السيارة
    ctx.fillStyle="#c82020";
    ctx.fillRect(
        carX-20,
        carY-35,
        40,
        70
    );

    // الزجاج
    ctx.fillStyle="#9bd1e8";
    ctx.fillRect(
        carX-14,
        carY-20,
        28,
        22
    );

    // العجلات
    ctx.fillStyle="#111";

    ctx.fillRect(carX-26,carY-25,7,18);
    ctx.fillRect(carX+19,carY-25,7,18);
    ctx.fillRect(carX-26,carY+10,7,18);
    ctx.fillRect(carX+19,carY+10,7,18);

    // الموقع
    if(carY < canvas.height*0.30){

        document.getElementById("location").innerText =
            "🌊 نهر دجلة - جسر الموصل";

    }else if(carY < canvas.height*0.65){

        document.getElementById("location").innerText =
            "🛣️ الطريق باتجاه الحضر";

    }else{

        document.getElementById("location").innerText =
            "🏘️ مركز قضاء الحضر";

    }

    document.getElementById("speed").innerText =
        "السرعة: " +
        (
            (keys["w"]||keys["s"]||keys["a"]||keys["d"]) ? "40" : "0"
        );

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
