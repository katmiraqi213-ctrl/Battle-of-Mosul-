<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>الموصل - الحضر | Open World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b9df;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    top:12px;
    right:12px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.62);
    padding:12px 16px;
    border-radius:16px;
    backdrop-filter:blur(5px);
}

#title{
    font-size:20px;
    font-weight:bold;
}

#location{
    margin-top:6px;
    font-size:13px;
}

#mission{
    margin-top:5px;
    color:#ffd84d;
    font-size:13px;
}

#info{
    position:fixed;
    bottom:15px;
    right:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.5);
    padding:9px 13px;
    border-radius:12px;
    font-size:12px;
}

#speed{
    position:fixed;
    bottom:15px;
    left:205px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.55);
    padding:8px 12px;
    border-radius:12px;
    font-size:12px;
}

#controls{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:20;
    display:grid;
    grid-template-columns:58px 58px 58px;
    grid-template-rows:58px 58px 58px;
    gap:6px;
    direction:ltr;
}

button{
    width:58px;
    height:58px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
    background:rgba(0,0,0,.62);
    color:white;
    font-size:23px;
    font-weight:bold;
    touch-action:none;
    user-select:none;
}

button:active{
    background:rgba(180,30,30,.85);
    transform:scale(.94);
}

#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:3}
#right{grid-column:3;grid-row:2}
</style>
</head>

<body>

<div id="hud">
    <div id="title">🇮🇶 الموصل - الحضر</div>
    <div id="location">🏙️ مدينة الموصل</div>
    <div id="mission">
        المهمة: اعبر جسر الموصل وتوجه إلى مركز قضاء الحضر
    </div>
</div>

<div id="info">🚗 تحرك بالأسهم أو أزرار التحكم</div>
<div id="speed">السرعة: 0</div>

<div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
</div>

<canvas id="game"></canvas>

function createMosulBridge(){

    const bridge=new THREE.Group();


    const roadMat=
        new THREE.MeshStandardMaterial({
            color:0x333333,
            roughness:.9
        });


    const concreteMat=
        new THREE.MeshStandardMaterial({
            color:0x777777,
            roughness:.9
        });


    const deck=new THREE.Mesh(
        new THREE.BoxGeometry(
            36,
            1.4,
            125
        ),
        roadMat
    );

    deck.position.y=1.2;

    bridge.add(deck);


    const sidewalk1=new THREE.Mesh(
        new THREE.BoxGeometry(
            5,
            1.8,
            125
        ),
        concreteMat
    );

    sidewalk1.position.set(
        -20,
        1.4,
        0
    );

    bridge.add(sidewalk1);


    const sidewalk2=sidewalk1.clone();

    sidewalk2.position.x=20;

    bridge.add(sidewalk2);


    for(
        let z=-45;
        z<=45;
        z+=30
    ){

        const pillar1=new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                8,
                5
            ),
            concreteMat
        );

        pillar1.position.set(
            -12,
            -2,
            z
        );

        bridge.add(pillar1);


        const pillar2=pillar1.clone();

        pillar2.position.x=12;

        bridge.add(pillar2);
    }


    for(
        const x of [-17,17]
    ){

        const rail=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                3,
                125
            ),
            concreteMat
        );

        rail.position.set(
            x,
            3,
            0
        );

        bridge.add(rail);
    }


    bridge.position.set(
        0,
        0,
        riverZ
    );

    scene.add(bridge);
}

createMosulBridge();


/* =====================================================
   الطرق
===================================================== */

function createRoad(
    x,
    z,
    width,
    length,
    rotation=0
){

    const road=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            length
        ),
        new THREE.MeshStandardMaterial({
            color:0x292929,
            roughness:.95
        })
    );

    road.rotation.x=-Math.PI/2;

    road.rotation.z=rotation;

    road.position.set(
        x,
        .03,
        z
    );

    scene.add(road);

    return road;
}

function createBuilding(
    x,
    z,
    w,
    h,
    d,
    color=0xb99062
){

    const building=new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            h,
            d
        ),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:1
        })
    );

    building.position.set(
        x,
        h/2,
        z
    );

    building.castShadow=true;
    building.receiveShadow=true;

    scene.add(building);


    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.35,
            .25,
            d+.35
        ),
        new THREE.MeshStandardMaterial({
            color:0x76563d
        })
    );

    roof.position.set(
        x,
        h+.1,
        z
    );

    scene.add(roof);
}

    const w=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .78,
            .78,
            .55,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0x101010
        })
    );

    w.rotation.z=Math.PI/2;

    w.position.set(
        x,
        .8,
        z
    );

    w.castShadow=true;

    car.add(w);
}


wheel(-2.15,-2.3);
wheel(2.15,-2.3);
wheel(-2.15,2.3);
wheel(2.15,2.3);


car.position.set(
    0,
    2,
    250
);

scene.add(car);


/* =====================================================
   التحكم
===================================================== */

const keys={};


window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


function button(
    id,
    key
){

    const b=
        document.getElementById(id);


    const start=e=>{
        e.preventDefault();
        keys[key]=true;
    };


    const stop=e=>{
        e.preventDefault();
        keys[key]=false;
    };


    b.addEventListener(
        "pointerdown",
        start
    );


    b.addEventListener(
        "pointerup",
        stop
    );


    b.addEventListener(
        "pointercancel",
        stop
    );


    b.addEventListener(
        "pointerleave",
        stop
    );
}


button("up","w");
button("down","s");
button("left","a");
button("right","d");


/* =====================================================
   حركة السيارة
===================================================== */

let currentSpeed=0;


function update(){

    const acceleration=.035;

    const maxSpeed=.9;


    if(
        keys["w"]||
        keys["arrowup"]
    ){

        currentSpeed+=acceleration;
    }

    else if(
        keys["s"]||
        keys["arrowdown"]
    ){

        currentSpeed-=acceleration;
    }

    else{

        currentSpeed*=.94;
    }


    currentSpeed=Math.max(
        -maxSpeed*.55,
        Math.min(
            maxSpeed,
            currentSpeed
        )
    );


    /* التوجيه */

    if(
        Math.abs(currentSpeed)>.01
    ){

        if(
            keys["a"]||
            keys["arrowleft"]
        ){

            car.rotation.y+=
                .035*
                (currentSpeed>=0?1:-1);
        }


        if(
            keys["d"]||
            keys["arrowright"]
        ){

            car.rotation.y-=
                .035*
                (currentSpeed>=0?1:-1);
        }
    }


    /* الحركة */

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        currentSpeed
    );


    /* حدود العالم */

    car.position.x=Math.max(
        -430,
        Math.min(
            430,
            car.position.x
        )
    );


    car.position.z=Math.max(
        -850,
        Math.min(
            500,
            car.position.z
        )
    );


    /* دوران العجلات */

    car.children.forEach(
        child=>{

            if(
                child.geometry &&
                child.geometry.type===
                "CylinderGeometry"
            ){

                child.rotation.x+=
                    currentSpeed*.08;
            }
        }
    );


    /* =================================================
       الكاميرا
    ================================================= */

    const behind=
        new THREE.Vector3(
            0,
            8,
            15
        );


    behind.applyQuaternion(
        car.quaternion
    );


    const targetCamera=
        new THREE.Vector3(
            car.position.x+
                behind.x,

            car.position.y+
                behind.y,

            car.position.z+
                behind.z
        );


    camera.position.lerp(
        targetCamera,
        .08
    );


    camera.lookAt(
        car.position.x,
        1.5,
        car.position.z
    );


    /* =================================================
       تحديد المنطقة
    ================================================= */

    let area="🛣️ الطريق";

    let mission=
        "المهمة: توجه إلى مركز قضاء الحضر";


    if(
        car.position.z>145
    ){

        area=
            "🏙️ مدينة الموصل";

        mission=
            "المهمة: اعبر جسر الموصل وتوجه جنوباً";
    }


    else if(
        car.position.z<=145 &&
        car.position.z>20
    ){

        area=
            "🌊 نهر دجلة - جسر الموصل";

        mission=
            "المهمة: اعبر جسر الموصل";
    }


    else if(
        car.position.z<=20 &&
        car.position.z>-430
    ){

        area=
            "🛣️ الطريق باتجاه الحضر";

        mission=
            "المهمة: أكمل الطريق إلى مركز قضاء الحضر";
    }


    else if(
        car.position.z<=-430 &&
        car.position.z>-610
    ){

        area=
            "🏘️ مركز قضاء الحضر";

        mission=
            "المهمة: تجول في مركز قضاء الحضر";
    }


    else if(
        car.position.z<=-610 &&
        car.position.z>-700
    ){

        area=
            "🏜️ الطريق إلى آثار الحضر";

        mission=
            "المهمة: توجه إلى آثار الحضر";
    }


    else if(
        car.position.z<=-700
    ){

        area=
            "🏛️ آثار الحضر";

        mission=
            "المهمة: وصلت إلى آثار الحضر";
    }


    document.getElementById(
        "location"
    ).textContent=
        area+
        " • X: "+
        Math.round(
            car.position.x
        )+
        " • Z: "+
        Math.round(
            car.position.z
        );


    document.getElementById(
        "mission"
    ).textContent=
        mission;


    document.getElementById(
        "speed"
    ).textContent=
        "السرعة: "+
        Math.round(
            Math.abs(
                currentSpeed
            )*100
        );
}


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
