<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b9df;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:12px;
    right:12px;
    z-index:20;
    min-width:210px;
    color:white;
    background:rgba(0,0,0,.68);
    padding:12px 15px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.3);
    backdrop-filter:blur(5px);
}

#title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:7px;
}

#location{
    font-size:15px;
    margin-bottom:5px;
}

#mission{
    font-size:13px;
    color:#ffe58a;
    margin-bottom:5px;
}

#speed{
    font-size:13px;
}

#error{
    display:none;
    position:fixed;
    z-index:100;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85%;
    background:#111;
    color:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

#controls{
    position:fixed;
    z-index:30;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:68px 68px 68px;
    grid-template-rows:68px 68px;
    gap:7px;
}

.btn{
    border:0;
    border-radius:18px;
    background:rgba(0,0,0,.62);

    font-size:29px;
    font-weight:bold;

}

.btn:active{
    background:rgba(255,255,255,.25);
    transform:scale(.95);
}

.up{
    grid-column:2;
    grid-row:1;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}
</style>
</head>

        keys[key]=true;
    }

    function stop(e){

        e.preventDefault();

        keys[key]=false;
    }

    button.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        stop,
        {passive:false}
    );

    button.addEventListener(
        "touchcancel",
        stop,
        {passive:false}
    );

    button.addEventListener(
        "mousedown",
        start
    );

    button.addEventListener(
        "mouseup",
        stop
    );

    button.addEventListener(
        "mouseleave",
        stop
    );
});


/* =========================
   حركة السيارة
========================= */

let speed=0;

let steering=0;

const maxSpeed=.85;

function updateCar(){

    let forward=false;
    let backward=false;

    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        forward=true;
    }

    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        backward=true;
    }


    if(forward){

        speed += .025;

    }else if(backward){

        speed -= .02;

    }else{

        speed *= .94;
    }


    speed =
        Math.max(
            -0.35,
            Math.min(
                maxSpeed,
                speed
            )
        );


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        steering=.035;

    }else if(
        keys["d"] ||
        keys["arrowright"]
    ){

        steering=-.035;

    }else{

        steering=0;
    }


    if(
        Math.abs(speed)>.01
    ){

        car.rotation.y +=
            steering *
            (speed/maxSpeed);
    }


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        direction,
        speed
    );


    /* حدود العالم */

    car.position.x =
        Math.max(
            -430,
            Math.min(
                430,
                car.position.x
            )
        );

    car.position.z =
        Math.max(
            -880,
            Math.min(
                500,
                car.position.z
            )
        );


    document
    .getElementById("speed")
    .innerText =
        "السرعة: " +
        Math.round(
            Math.abs(speed)*80
        );
}

function updateCamera(){

    const offset =
        new THREE.Vector3(
            0,
            15,
            25
        );

    offset.applyQuaternion(
        car.quaternion
    );

    const target =
        car.position
        .clone()
        .add(offset);


    camera.position.lerp(
        target,
        .08
    );


    const look =
        car.position
        .clone();

    look.y += 3;

    camera.lookAt(
        look
    );
}

        .getElementById("mission")
        .innerText =
        "المهمة: اعبر جسر الموصل";
    }

    else if(z>-430){

        text="🛣️ الطريق باتجاه الحضر";

        document
        .getElementById("mission")
        .innerText =
        "المهمة: تابع الطريق جنوباً نحو قضاء الحضر";
    }

    else if(z>-610){

        text="🏘️ مركز قضاء الحضر";

        document
        .getElementById("mission")
        .innerText =
        "المهمة: اعبر مركز قضاء الحضر";
    }

    else if(z>-700){

        text="🏜️ الطريق إلى آثار الحضر";

        document
        .getElementById("mission")
        .innerText =
        "المهمة: توجه إلى آثار الحضر";
    }

    else{

        text="🏛️ آثار الحضر";

        document
        .getElementById("mission")
        .innerText =
        "🎉 وصلت إلى آثار الحضر!";
    }


    document
    .getElementById("location")
    .innerText=text;
}


/* =========================
   تشغيل
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    updateCar();

    updateCamera();

    updateLocation();

    renderer.render(
        scene,
        camera
    );
}


camera.position.set(
    0,
    15,
    330
);

camera.lookAt(
    0,
    2,
    300
);


animate();


/* =========================
   تغيير حجم الشاشة
========================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

}
catch(error){

    document
    .getElementById("error")
    .style.display="block";

    document
    .getElementById("errorText")
    .innerText =
        error.message;
}

</script>
